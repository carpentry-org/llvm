name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Carp
        uses: carpentry-org/setup-carp@v1

      - name: Install LLVM (Ubuntu)
        if: runner.os == 'Linux'
        # the ORC bindings need LLVM 21+, newer than the distribution package
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Run tests
        run: |
          set -euo pipefail
          carp -x test/llvm.carp
          carp -x test/frontend.carp
          carp -x test/advanced.carp
          carp -x test/orc.carp
          carp -x examples/mini.carp

      - name: Install angler
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/angler /tmp/angler
          (cd /tmp/angler && carp -b main.carp)
          sudo install -m 755 /tmp/angler/out/angler /usr/local/bin/

      - name: Install carp-fmt
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/carpentry-org/carp-fmt /tmp/carp-fmt
          (cd /tmp/carp-fmt && carp -b main.carp)
          sudo install -m 755 /tmp/carp-fmt/out/carp-fmt /usr/local/bin/

      - name: Lint
        run: |
          angler $(find . -name '*.carp' \
            -not -path './out/*' \
            -not -path './docs/*' \
            -not -path './.carp-src/*' \
            -not -path './examples/*')

      - name: Format check
        run: |
          carp-fmt --check $(find . -name '*.carp' \
            -not -path './out/*' \
            -not -path './docs/*' \
            -not -path './.carp-src/*' \
            -not -path './examples/*')

      - name: Generate docs
        run: carp -x gendocs.carp
